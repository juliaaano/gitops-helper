# Generated for gitops-workshop scenario
# Job to create sample Git repo in Gitea with httpd deployment manifests
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-repo-setup
  namespace: {{ .Values.gitea.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-repo-setup
  namespace: {{ .Values.gitea.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: gitea-repo-setup
    namespace: {{ .Values.gitea.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-create-sample-repo
  namespace: {{ .Values.gitea.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: gitea-repo-setup
      restartPolicy: OnFailure
      volumes:
        - name: manifests
          configMap:
            name: sample-app-manifests
      containers:
        - name: create-repo
          image: registry.redhat.io/openshift4/ose-cli:latest
          volumeMounts:
            - name: manifests
              mountPath: /tmp/manifests
          env:
            - name: GITEA_ADMIN_USER
              value: {{ .Values.gitea.adminUser }}
            - name: GITEA_ADMIN_PASSWORD
              value: {{ .Values.gitea.adminPassword }}
            - name: GITEA_NAMESPACE
              value: {{ .Values.gitea.namespace }}
            - name: REPO_NAME
              value: {{ .Values.gitea.sampleRepo.name }}
          command:
            - /bin/bash
            - -c
            - |
              set -e

              # Wait for Gitea to be ready
              GITEA_URL="https://gitea-${GITEA_NAMESPACE}.{{ .Values.deployer.domain }}"
              echo "Waiting for Gitea at ${GITEA_URL}..."
              for i in $(seq 1 120); do
                if curl -sk "${GITEA_URL}/api/v1/version" | grep -q version; then
                  echo "Gitea is ready."
                  break
                fi
                echo "Attempt $i: Gitea not ready yet..."
                sleep 10
              done

              # Create repo under admin user
              echo "Creating repository ${REPO_NAME}..."
              RESPONSE=$(curl -sk -w "%{http_code}" -o /tmp/create_response.json \
                -X POST "${GITEA_URL}/api/v1/user/repos" \
                -H "Content-Type: application/json" \
                -u "${GITEA_ADMIN_USER}:${GITEA_ADMIN_PASSWORD}" \
                -d "{
                  \"name\": \"${REPO_NAME}\",
                  \"description\": \"Sample httpd application for GitOps workshop\",
                  \"private\": false,
                  \"auto_init\": true,
                  \"default_branch\": \"main\"
                }")
              echo "Create repo response: ${RESPONSE}"

              if [[ "${RESPONSE}" != "201" && "${RESPONSE}" != "409" ]]; then
                echo "Warning: unexpected response, continuing anyway..."
              fi

              # Clone and push manifests
              cd /tmp
              GIT_SSL_NO_VERIFY=true git clone "https://${GITEA_ADMIN_USER}:${GITEA_ADMIN_PASSWORD}@gitea-${GITEA_NAMESPACE}.{{ .Values.deployer.domain }}/${GITEA_ADMIN_USER}/${REPO_NAME}.git" repo || {
                echo "Clone failed, waiting and retrying..."
                sleep 15
                GIT_SSL_NO_VERIFY=true git clone "https://${GITEA_ADMIN_USER}:${GITEA_ADMIN_PASSWORD}@gitea-${GITEA_NAMESPACE}.{{ .Values.deployer.domain }}/${GITEA_ADMIN_USER}/${REPO_NAME}.git" repo
              }
              cd repo

              git config user.email "admin@demo.redhat.com"
              git config user.name "${GITEA_ADMIN_USER}"

              mkdir -p k8s
              cp /tmp/manifests/deployment.yaml k8s/deployment.yaml
              cp /tmp/manifests/service.yaml k8s/service.yaml

              git add .
              git diff --cached --quiet && echo "No changes to commit" && exit 0
              git commit -m "Add sample httpd deployment manifests"
              GIT_SSL_NO_VERIFY=true git push origin main

              echo "Sample repository created and populated successfully."

              # Fork repository for each user
              {{- range .Values.gitea.users }}
              echo "Forking repo for {{ . }}..."
              curl -sk -X POST "${GITEA_URL}/api/v1/repos/${GITEA_ADMIN_USER}/${REPO_NAME}/forks" \
                -H "Content-Type: application/json" \
                -u "{{ . }}:${GITEA_ADMIN_PASSWORD}" \
                -d '{}' || echo "Fork for {{ . }} may already exist"
              {{- end }}

              echo "All done."
