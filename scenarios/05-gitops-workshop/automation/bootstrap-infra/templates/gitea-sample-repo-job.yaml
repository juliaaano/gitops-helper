# Job to create sample Git repo in Gitea with httpd deployment manifests
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-repo-setup
  namespace: {{ .Values.gitea.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-repo-setup
  namespace: {{ .Values.gitea.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: gitea-repo-setup
    namespace: {{ .Values.gitea.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-create-sample-repo
  namespace: {{ .Values.gitea.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: gitea-repo-setup
      restartPolicy: OnFailure
      volumes:
        - name: manifests
          configMap:
            name: gitea-sample-app
      containers:
        - name: create-repo
          image: registry.redhat.io/openshift4/ose-cli:latest
          volumeMounts:
            - name: manifests
              mountPath: /tmp/manifests
          env:
            - name: GITEA_ADMIN_USER
              value: {{ .Values.gitea.adminUser }}
            - name: GITEA_ADMIN_PASSWORD
              value: {{ .Values.gitea.adminPassword }}
            - name: GITEA_NAMESPACE
              value: {{ .Values.gitea.namespace }}
            - name: REPO_NAME
              value: {{ .Values.gitea.sampleRepo.name }}
          command:
            - /bin/bash
            - -c
            - |
              set -e

              # Wait for Gitea to be ready
              GITEA_URL="https://gitea-${GITEA_NAMESPACE}.{{ .Values.deployer.domain }}"
              echo "Waiting for Gitea at ${GITEA_URL}..."
              for i in $(seq 1 120); do
                if curl -sk "${GITEA_URL}/api/v1/version" | grep -q version; then
                  echo "Gitea is ready."
                  break
                fi
                echo "Attempt $i: Gitea not ready yet..."
                sleep 10
              done

              # Create repo under admin user
              echo "Creating repository ${REPO_NAME}..."
              RESPONSE=$(curl -sk -w "%{http_code}" -o /tmp/create_response.json \
                -X POST "${GITEA_URL}/api/v1/user/repos" \
                -H "Content-Type: application/json" \
                -u "${GITEA_ADMIN_USER}:${GITEA_ADMIN_PASSWORD}" \
                -d "{
                  \"name\": \"${REPO_NAME}\",
                  \"description\": \"Sample httpd application for GitOps workshop\",
                  \"private\": false,
                  \"auto_init\": true,
                  \"default_branch\": \"main\"
                }")
              echo "Create repo response: ${RESPONSE}"

              # Use Gitea API to create files (no git needed)
              echo "Adding deployment.yaml via API..."
              DEPLOY_CONTENT=$(base64 -w0 /tmp/manifests/deployment.yaml)
              curl -sk -X POST "${GITEA_URL}/api/v1/repos/${GITEA_ADMIN_USER}/${REPO_NAME}/contents/k8s/deployment.yaml" \
                -H "Content-Type: application/json" \
                -u "${GITEA_ADMIN_USER}:${GITEA_ADMIN_PASSWORD}" \
                -d "{\"content\": \"${DEPLOY_CONTENT}\", \"message\": \"Add httpd deployment\"}" || echo "deployment.yaml may already exist"

              echo "Adding service.yaml via API..."
              SVC_CONTENT=$(base64 -w0 /tmp/manifests/service.yaml)
              curl -sk -X POST "${GITEA_URL}/api/v1/repos/${GITEA_ADMIN_USER}/${REPO_NAME}/contents/k8s/service.yaml" \
                -H "Content-Type: application/json" \
                -u "${GITEA_ADMIN_USER}:${GITEA_ADMIN_PASSWORD}" \
                -d "{\"content\": \"${SVC_CONTENT}\", \"message\": \"Add httpd service\"}" || echo "service.yaml may already exist"

              echo "Sample repository created and populated successfully."

              # Fork repository for each user
              {{- range .Values.gitea.users }}
              echo "Forking repo for {{ . }}..."
              curl -sk -X POST "${GITEA_URL}/api/v1/repos/${GITEA_ADMIN_USER}/${REPO_NAME}/forks" \
                -H "Content-Type: application/json" \
                -u "{{ . }}:${GITEA_ADMIN_PASSWORD}" \
                -d '{}' || echo "Fork for {{ . }} may already exist"
              {{- end }}

              echo "All done."
