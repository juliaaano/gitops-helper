# Gitea CR - depends on the Gitea operator CRD
apiVersion: pfe.rhpds.com/v1
kind: Gitea
metadata:
  name: gitea
  namespace: {{ .Values.gitea.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  giteaImage: {{ .Values.gitea.image }}
  giteaImageTag: {{ .Values.gitea.imageTag }}
  giteaVolumeSize: 5Gi
  postgresqlImage: {{ .Values.gitea.postgresqlImage }}
  postgresqlImageTag: "{{ .Values.gitea.postgresqlImageTag }}"
  postgresqlVolumeSize: 5Gi
  giteaSsl: true
  giteaAdminUser: {{ .Values.gitea.adminUser }}
  giteaAdminPassword: {{ .Values.gitea.adminPassword }}
  giteaAdminEmail: "{{ .Values.gitea.adminUser }}@demo.redhat.com"
  giteaCreateUsers: true
  giteaGenerateUserFormat: user
  giteaUserNumber: {{ len .Values.gitea.users }}
  giteaUserPassword: {{ .Values.gitea.userPassword }}
  giteaUserEmailDomain: "demo.redhat.com"
  giteaMigrateRepositories: false
