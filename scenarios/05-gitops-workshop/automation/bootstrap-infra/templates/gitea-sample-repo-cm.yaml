# Generated for gitops-workshop scenario
# ConfigMap containing sample Kubernetes manifests to seed into Gitea
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-app-manifests
  namespace: {{ .Values.gitea.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  deployment.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: httpd
      labels:
        app: httpd
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: httpd
      template:
        metadata:
          labels:
            app: httpd
        spec:
          containers:
            - name: httpd
              image: registry.access.redhat.com/ubi9/httpd-24:latest
              ports:
                - containerPort: 8080
              resources:
                limits:
                  memory: 256Mi
                  cpu: 200m
                requests:
                  memory: 128Mi
                  cpu: 100m
  service.yaml: |
    apiVersion: v1
    kind: Service
    metadata:
      name: httpd
      labels:
        app: httpd
    spec:
      selector:
        app: httpd
      ports:
        - port: 8080
          targetPort: 8080
          protocol: TCP
