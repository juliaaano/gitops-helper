# ConfigMap with the sample app manifests that will be pushed to Gitea
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-sample-app
  namespace: {{ .Values.gitea.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  deployment.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: httpd
      labels:
        app: httpd
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: httpd
      template:
        metadata:
          labels:
            app: httpd
        spec:
          containers:
          - name: httpd
            image: registry.access.redhat.com/ubi9/httpd-24:latest
            ports:
            - containerPort: 8080
              protocol: TCP
            resources:
              limits:
                memory: 128Mi
              requests:
                memory: 64Mi
  service.yaml: |
    apiVersion: v1
    kind: Service
    metadata:
      name: httpd
      labels:
        app: httpd
    spec:
      selector:
        app: httpd
      ports:
      - port: 8080
        targetPort: 8080
        protocol: TCP
