apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: quay-operator
  namespace: {{ .Values.quay.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  channel: {{ .Values.quay.channel }}
  installPlanApproval: Automatic
  name: quay-operator
  source: {{ .Values.quay.source }}
  sourceNamespace: {{ .Values.quay.sourceNamespace }}
