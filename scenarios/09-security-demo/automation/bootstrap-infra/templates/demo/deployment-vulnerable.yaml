# Generated from rhdp-gitops-patterns/skeleton (v0.1.0)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-app
  namespace: {{ .Values.demo.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app: vulnerable-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-app
  template:
    metadata:
      labels:
        app: vulnerable-app
    spec:
      containers:
        - name: centos7
