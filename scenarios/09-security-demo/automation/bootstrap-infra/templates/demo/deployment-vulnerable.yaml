            - /bin/sh
            - -c
            - "while true; do echo 'running vulnerable container for RHACS demo'; sleep 3600; done"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
