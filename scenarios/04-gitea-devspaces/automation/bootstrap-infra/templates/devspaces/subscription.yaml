---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .Values.devspaces.operator.name }}
  namespace: {{ .Values.devspaces.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  channel: {{ .Values.devspaces.operator.channel }}
  installPlanApproval: Automatic
  name: {{ .Values.devspaces.operator.name }}
  source: {{ .Values.devspaces.operator.source }}
  sourceNamespace: {{ .Values.devspaces.operator.sourceNamespace }}
