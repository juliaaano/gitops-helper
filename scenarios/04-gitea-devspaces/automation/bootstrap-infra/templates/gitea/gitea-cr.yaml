# Generated from rhdp-gitops-patterns/examples/ai-app-dev (v0.1.0)
---
apiVersion: pfe.rhpds.com/v1
kind: Gitea
metadata:
  name: {{ .Values.gitea.instance.name }}
  namespace: {{ .Values.gitea.instanceNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  giteaVolumeSize: {{ .Values.gitea.instance.volumeSize }}
  postgresqlVolumeSize: {{ .Values.gitea.instance.postgresqlVolumeSize }}
  giteaSsl: {{ .Values.gitea.instance.ssl }}
  giteaAdminUser: {{ .Values.gitea.instance.adminUser }}
  giteaAdminPassword: {{ .Values.gitea.instance.adminPassword }}
  giteaAdminEmail: {{ .Values.gitea.instance.adminEmail }}
