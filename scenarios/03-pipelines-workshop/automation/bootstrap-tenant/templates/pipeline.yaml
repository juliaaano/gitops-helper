{{- range .Values.namespaces }}
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: sample-build-pipeline
  namespace: {{ $.Values.username }}-{{ . }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  workspaces:
    - name: shared-workspace
  params:
    - name: git-url
      type: string
      description: The URL of the Git repository to clone
      default: "https://github.com/openshift/pipelines-vote-api.git"
    - name: image-name
      type: string
      description: The name of the image to build
      default: "image-registry.openshift-image-registry.svc:5000/{{ $.Values.username }}-{{ . }}/vote-api:latest"
  tasks:
    - name: git-clone
      taskRef:
        name: git-clone
        kind: ClusterTask
      params:
        - name: url
          value: $(params.git-url)
      workspaces:
        - name: output
          workspace: shared-workspace
    - name: build
      taskRef:
        name: buildah
        kind: ClusterTask
      runAfter:
        - git-clone
      params:
        - name: IMAGE
          value: $(params.image-name)
      workspaces:
        - name: source
          workspace: shared-workspace
---
{{- end }}
