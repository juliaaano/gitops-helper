# Auto-injected by the deployer. Do not pass these manually.
deployer:
  domain: apps.cluster.example.com
  apiUrl: https://api.cluster.example.com:6443
  guid: xxxxx

# Shared namespace for tenant cleanup jobs. Set to "" to disable.
tenantLifecycle: ""

gitea:
  namespace: gitea
  catalogImage: quay.io/rhpds/gitea-catalog:latest
  adminUser: gitea-admin
  adminPassword: openshift
  dataSize: 10Gi
  users:
    - username: user1
      password: openshift
    - username: user2
      password: openshift
    - username: user3
      password: openshift
  migrateRepositories: true
  migrateRepos:
    - name: openshift-starter-guides
      url: https://github.com/redhat-scholars/openshift-starter-guides
      private: false

pipelines:
  channel: pipelines-1.17
  source: redhat-operators
  sourceNamespace: openshift-marketplace

rhoai:
  channel: stable-3.3
  source: redhat-operators
  sourceNamespace: openshift-marketplace

aiModels:
  namespace: ai-models
  modelName: qwen-05b
  ociImage: "oci://quay.io/redhat-ai-services/modelcar-catalog:qwen2.5-0.5b-instruct"
  runtimeImage: "quay.io/rh-aiservices-bu/vllm-cpu-openai-ubi9:0.3"

aiInfra:
  namespace: ai-infra
