apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: ovms-runtime
  namespace: {{ .Values.aiModels.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  supportedModelFormats:
    - name: openvino_ir
      version: opset1
      autoSelect: true
  multiModel: false
  containers:
    - name: kserve-container
      image: quay.io/opendatahub/openvino_model_server:stable
      args:
        - --model_name={{ .Values.aiModels.modelName }}
        - --model_path=/models
        - --port=8080
        - --rest_port=8888
        - --target_device=CPU
      ports:
        - containerPort: 8080
          protocol: TCP
        - containerPort: 8888
          protocol: TCP
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 2Gi
