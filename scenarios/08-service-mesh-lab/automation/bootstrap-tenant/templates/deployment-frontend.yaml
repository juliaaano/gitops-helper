# S2I httpd-24 image requires command override and content mount
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Values.username }}-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
      - name: httpd
        image: registry.access.redhat.com/ubi9/httpd-24
        command: ["/usr/libexec/s2i/run"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: content
          mountPath: /opt/app-root/src
      volumes:
      - name: content
        configMap:
          name: frontend-content
