apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.username }}-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.username }}-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
