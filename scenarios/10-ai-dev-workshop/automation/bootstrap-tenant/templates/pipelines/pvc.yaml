# Generated from rhdp-gitops-patterns (gitops-patterns.md - PVC section)
# PVC placed at sync-wave 1, same as the Pipeline that uses it, to avoid
# WaitForFirstConsumer blocking.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipeline-workspace
  namespace: {{ .Values.username }}-ai-dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pipelineWorkspaceSize }}
