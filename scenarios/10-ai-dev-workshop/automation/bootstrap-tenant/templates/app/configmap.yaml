# Generated from rhdp-gitops-patterns/skeleton (v0.1.0)
# Per-user copy of model configuration for local namespace reference
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-config
  namespace: {{ .Values.username }}-ai-dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  model_name: {{ .Values.aiModels.modelName | quote }}
  model_endpoint: {{ .Values.aiModels.modelEndpoint | quote }}
  embedding_model: {{ .Values.aiModels.embeddingModel | quote }}
